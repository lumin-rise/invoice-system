# 发票系统子域名 Nginx 配置
# 把 invoice.example.com 全部替换成你的真实子域名后，
# 放到服务器 /etc/nginx/conf.d/invoice.conf，然后执行 nginx -t && nginx -s reload

server {
    listen 80;
    server_name invoice.example.com;   # ← 改成你的子域名

    # 单张发票 ≤30MB，一批多张，上限放宽到 120MB（按需调整）
    client_max_body_size 120m;

    # OCR/PDF 解析较慢，读超时放宽到 5 分钟
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 安全说明 ─────────────────────────────────────────
    # 系统已内置登录鉴权（账号密码 + 会话 Cookie），无需 htpasswd。
    # 公网部署仍建议：
    #   1. 首次登录后立即修改初始密码（见 data/初始密码.txt）
    #   2. 有条件的话上 HTTPS（如 certbot --nginx）

    # 或者只允许固定 IP 访问（取消注释并替换成你的 IP）：
    # allow 你的IP;
    # deny all;
}
