services:
  invoice-system:
    build:
      context: .
      args:
        # 国内服务器构建加速；海外构建删掉这两行即可
        NPM_REGISTRY: https://registry.npmmirror.com
        PIP_INDEX: https://pypi.tuna.tsinghua.edu.cn/simple
    container_name: invoice-system
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/backend/data     # 发票原件/会话/凭据持久化
    environment:
      TZ: Asia/Shanghai
      RETENTION_DAYS: "30"           # 自动清理保留期（天）
